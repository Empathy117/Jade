[project]
name = "immersive-reader-pipeline"
version = "0.1.0"
description = "Build-time pipeline for AI Director + Reader Runtime"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "jsonschema>=4.25,<5",
]

[project.scripts]
immersive-reader-import = "immersive_reader.importer:entrypoint"
immersive-reader-validate-library = "immersive_reader.library_validator:entrypoint"
immersive-reader-validate = "immersive_reader.validator:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/immersive_reader"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
